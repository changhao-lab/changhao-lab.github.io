name: Sync publications from Google Scholar

on:
  schedule:
    # Once daily at 03:17 Asia/Shanghai (19:17 UTC).
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-google-scholar-publications
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'changhao-lab/changhao-lab.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the website
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install sync dependency
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Check Google Scholar
        id: scholar
        shell: bash
        run: |
          set +e
          python scripts/sync_google_scholar.py
          status=$?
          set -e

          if [[ "$status" -eq 75 ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Google Scholar temporarily unavailable::Existing publication data was kept unchanged. The next daily run will retry automatically."
            exit 0
          fi

          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Detect publication changes
        id: changes
        if: steps.scholar.outputs.available == 'true'
        shell: bash
        run: |
          if git diff --quiet -- _data/publications.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No publication changes to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push new publications
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml
          git commit -m "Sync publications from Google Scholar"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Request a GitHub Pages build
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
